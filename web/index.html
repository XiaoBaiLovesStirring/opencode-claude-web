<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OpenCode · Claude Web</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --parchment:#f5f4ed; --ivory:#faf9f5; --sand:#f0eee6; --border:#e8e6dc;
  --text:#141413; --text2:#5e5d59; --text3:#87867f;
  --terracotta:#c96442; --bubble:#eeece3; --hover:#eceae0;
  --ring:0 0 0 1px rgba(20,20,19,.06);
  --add-bg:rgba(120,140,93,.15); --add-fg:#557037;
  --del-bg:rgba(181,51,51,.10);  --del-fg:#9c4444;
  --tk-cmt:#a8a49b; --tk-str:#6f8a52; --tk-kw:#b8593a; --tk-num:#9a6a42;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sidebar-w:264px;
}
html[data-theme="dark"]{
  --parchment:#141413; --ivory:#1c1b19; --sand:#262523; --border:#30302e;
  --text:#f5f4ed; --text2:#b0aea5; --text3:#87867f;
  --terracotta:#d97757; --bubble:#2a2927; --hover:#2e2d2b;
  --ring:0 0 0 1px rgba(245,244,237,.08);
  --add-bg:rgba(120,140,93,.20); --add-fg:#9db97e;
  --del-bg:rgba(181,51,51,.20);  --del-fg:#d98c8c;
  --tk-cmt:#7a7871; --tk-str:#9db97e; --tk-kw:#e0946b; --tk-num:#d7a978;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--parchment);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
.serif{font-family:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
.app{display:flex;height:100dvh;height:100vh;overflow:hidden}

.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--sand);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.brand svg{width:24px;height:24px;color:var(--terracotta);flex:0 0 24px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.pad{padding:0 12px}
.newchat{display:flex;align-items:center;gap:9px;width:100%;padding:10px 13px;border-radius:10px;background:var(--ivory);box-shadow:var(--ring);color:var(--text);transition:.15s;margin-bottom:16px}
.newchat:hover{color:var(--terracotta);box-shadow:0 0 0 1px var(--terracotta)}
.newchat svg{width:15px;height:15px;flex:0 0 15px}
.label{padding:0 18px;margin:6px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.sessions{flex:1;overflow-y:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
.session{display:block;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);transition:.12s}
.session:hover{background:var(--hover);color:var(--text)}
.session.on{background:var(--hover);color:var(--text);font-weight:500}
.session small{display:block;font-size:11.5px;color:var(--text3);font-weight:400;margin-top:2px}
.empty-hint{padding:14px 18px;font-size:12.5px;color:var(--text3);line-height:1.6}
.foot{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.foot button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--text2);transition:.12s}
.foot button:hover{background:var(--hover);color:var(--text)}
.foot svg{width:16px;height:16px;flex:0 0 16px}
.pill{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(201,100,66,.14);color:var(--terracotta)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--parchment)}
.top{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex:0 0 auto}
.menu{display:none;width:36px;height:36px;flex:0 0 36px;border-radius:9px;align-items:center;justify-content:center;color:var(--text2)}
.menu svg{width:18px;height:18px}
.model{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--text);transition:.15s;box-shadow:var(--ring);max-width:56vw;overflow:hidden}
.model span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model:hover{background:var(--sand)}
.model svg{width:14px;height:14px;color:var(--text3);flex:0 0 14px}
.spacer{flex:1;min-width:4px}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s;font-size:13px;font-weight:500;position:relative}
.iconbtn:hover{background:var(--sand);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;left:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--add-fg)}
.dot.off{background:var(--del-fg)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 24px}
.hello{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;min-height:100%;padding:32px 0}
.hello h1{font-size:36px;line-height:1.22;letter-spacing:-.02em;text-align:center;font-weight:400}
.hello h1 em{color:var(--terracotta);font-style:normal}
.suggests{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}
.tag{padding:8px 14px;border-radius:999px;box-shadow:var(--ring);font-size:13.5px;color:var(--text2);transition:.15s;line-height:1.3}
.tag:hover{color:var(--terracotta);box-shadow:0 0 0 1px var(--terracotta)}

.thread{padding:8px 0 24px}
.turn{display:flex;gap:12px;padding:16px 0}
.turn .avatar{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:3px;background:var(--terracotta);color:#fff;font-size:13px;line-height:1}
.turn .body{flex:1;min-width:0;padding-top:2px;overflow-wrap:anywhere}
.turn.user{justify-content:flex-end}
.turn.user .body{flex:0 1 auto;max-width:78%;background:var(--bubble);border-radius:16px;padding:10px 14px;white-space:pre-wrap}
.p{font-size:15.5px;line-height:1.65;margin:6px 0}
.p + .p{margin-top:10px}
.p code,li code{font-family:var(--mono);font-size:13px;background:var(--sand);padding:1.5px 5px;border-radius:5px;color:var(--text)}
.msgmeta{margin-top:8px;font-size:11.5px;color:var(--text3);font-family:var(--mono)}

.think{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text3);padding:5px 0;cursor:pointer;transition:.14s;max-width:100%}
.think:hover{color:var(--text2)}
.think .sp{width:13px;height:13px;color:var(--terracotta);opacity:.85;flex:0 0 13px}
.think .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.think .chev{width:11px;height:11px;flex:0 0 11px;color:var(--text3);transition:transform .18s}
.think.open .chev{transform:rotate(90deg)}

.steps{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:2px 0 6px;width:100%}
.step{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border-radius:9px;background:var(--sand);color:var(--text2);font-size:13px;cursor:pointer;transition:.14s;box-shadow:var(--ring);max-width:100%}
.step:hover{background:var(--hover);color:var(--text)}
.step .ico{width:14px;height:14px;flex:0 0 14px;color:var(--text3)}
.step .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .meta{color:var(--text3);font-size:11.5px;font-family:var(--mono);flex:0 0 auto}
.step .chev{width:11px;height:11px;flex:0 0 11px;color:var(--text3);transition:transform .18s}
.step.open .chev{transform:rotate(90deg)}
.step.open{background:var(--hover);color:var(--text)}
.step.running .ico{color:var(--terracotta);animation:spin 1.1s linear infinite}
.step.err{color:var(--del-fg)}
.step.err .ico{color:var(--del-fg)}
@keyframes spin{to{transform:rotate(360deg)}}

.coll{display:none;width:100%;margin:6px 0 4px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--ivory);box-shadow:var(--ring)}
.coll.show{display:block}
.coll .dhead{padding:7px 12px;font-size:11.5px;color:var(--text3);background:var(--sand);border-bottom:1px solid var(--border);letter-spacing:.02em}
.coll pre{margin:0;padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow-x:auto;color:var(--text2);white-space:pre}
.coll.thinking pre{color:var(--text3);font-style:italic;white-space:pre-wrap;word-break:break-word;line-height:1.75}

.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--ivory);margin:10px 0;box-shadow:var(--ring)}
.card-head{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sand);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text2);min-width:0;cursor:pointer;user-select:none;transition:background .14s}
.card-head:hover{background:var(--hover)}
.card.collapsed .card-head{border-bottom-color:transparent}
.card.collapsed .card-body{display:none}
.card-head .name{font-weight:500;color:var(--text);font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .acts{margin-left:auto;display:flex;gap:2px;flex:0 0 auto}
.card-head .acts button{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);padding:3px 8px;border-radius:7px;transition:.13s;white-space:nowrap}
.card-head .acts button:hover{background:var(--hover);color:var(--text)}
.card-head .acts svg{width:13px;height:13px}
.card-head .fld{width:16px;height:16px;flex:0 0 16px;color:var(--text3);transition:transform .18s;margin-left:2px}
.card.collapsed .card-head .fld{transform:rotate(-90deg)}
.card-body{padding:0}
.card-body pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow-x:auto;color:var(--text);white-space:pre}

.tk-cmt{color:var(--tk-cmt);font-style:italic}
.tk-str{color:var(--tk-str)}
.tk-kw{color:var(--tk-kw)}
.tk-num{color:var(--tk-num)}

.diff{font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow-x:auto}
.dl{display:flex;min-width:max-content;padding:0 12px}
.dl .ln{width:32px;flex:0 0 32px;text-align:right;padding-right:12px;color:var(--text3);opacity:.65;user-select:none}
.dl .tx{white-space:pre;flex:1}
.dl.add{background:var(--add-bg)}.dl.add .ln{color:var(--add-fg);opacity:.9}
.dl.del{background:var(--del-bg)}.dl.del .ln{color:var(--del-fg);opacity:.9}
.dl.hunk{background:var(--sand);color:var(--text3);font-size:11.5px;padding:3px 12px}

.diff,.card-body pre,.coll pre{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.diff::-webkit-scrollbar,.card-body pre::-webkit-scrollbar,.coll pre::-webkit-scrollbar{height:7px}
.diff::-webkit-scrollbar-thumb,.card-body pre::-webkit-scrollbar-thumb,.coll pre::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.composer{flex:0 0 auto;padding:10px 24px calc(16px + env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;background:var(--ivory);border-radius:20px;padding:13px 15px 9px;box-shadow:var(--ring),0 2px 10px rgba(20,20,19,.05);transition:.15s}
.box:focus-within{box-shadow:0 0 0 1px var(--border),0 2px 14px rgba(20,20,19,.09)}
textarea{width:100%;border:none;background:none;outline:none;resize:none;font-size:16px;line-height:1.5;max-height:160px;font-family:inherit;display:block}
textarea::placeholder{color:var(--text3)}
.tools{display:flex;align-items:center;gap:6px;margin-top:6px}
.tool{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:.15s}
.tool:hover{background:var(--sand);color:var(--text)}
.tool svg{width:16px;height:16px}
.send{width:34px;height:34px;border-radius:10px;background:var(--terracotta);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s;margin-left:auto}
.send:hover{filter:brightness(1.08)}
.send.busy{opacity:.5}
.send svg{width:16px;height:16px}
.hint{text-align:center;font-size:12px;color:var(--text3);margin-top:8px}

.scrim{display:none;position:fixed;inset:0;background:rgba(20,20,19,.4);z-index:40;opacity:0;transition:opacity .22s ease}
.scrim.show{opacity:1}
.picker,.sheet{position:fixed;z-index:60;background:var(--ivory);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(20,20,19,.18);display:none;max-height:62vh;overflow-y:auto}
.picker.show,.sheet.show{display:block}
.picker{top:64px;left:20px;width:360px;max-width:calc(100vw - 40px)}
.sheet{top:64px;right:20px;width:380px;max-width:calc(100vw - 40px)}
.pk-head,.sh-head{padding:10px 14px;font-size:12px;color:var(--text3);border-bottom:1px solid var(--border);background:var(--sand);position:sticky;top:0}
.pk-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:9px 14px;border-bottom:1px solid var(--border);transition:.12s}
.pk-item:last-child{border-bottom:none}
.pk-item:hover,.pk-item.on{background:var(--hover)}
.pk-name{font-size:13.5px;color:var(--text)}
.pk-sub,.sh-sub{font-size:11.5px;color:var(--text3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-item{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border-bottom:1px solid var(--border)}
.sh-item:last-child{border-bottom:none}

@media (max-width: 900px){
  .menu{display:flex}
  .sidebar{position:fixed;top:0;left:0;z-index:50;height:100dvh;height:100vh;width:min(280px,82vw);flex-basis:auto;transform:translateX(-100%);transition:transform .24s ease;box-shadow:0 10px 40px rgba(20,20,19,.18)}
  .sidebar.open{transform:translateX(0)}
  .scrim{display:block;pointer-events:none}
  .scrim.show{pointer-events:auto}
  .top{padding:10px 14px;gap:6px}
  .model{max-width:44vw;padding:6px 11px;font-size:13.5px}
  .wrap{padding:0 16px}
  .hello{gap:18px;padding:24px 0}
  .hello h1{font-size:26px}
  .tag{font-size:13px;padding:7px 12px}
  .composer{padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
  .box{border-radius:18px;padding:11px 13px 7px}
  .turn{gap:10px;padding:14px 0}
  .turn.user .body{max-width:86%}
  .p{font-size:15px}
  .step{font-size:12.5px;padding:5px 9px 5px 8px}
  .step .meta{display:none}
  .card-head .name{max-width:42vw}
  .diff{font-size:11.5px}
  .card-body pre,.coll pre{font-size:12px}
  .picker,.sheet{left:14px;right:14px;width:auto;top:58px}
}
@media (max-width: 380px){
  .hello h1{font-size:22px}
  .model{max-width:38vw}
  .iconbtn{width:32px;height:32px;flex-basis:32px}
}
@media (max-height: 520px){
  .hello{gap:12px;padding:12px 0}
  .hello h1{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20.5 10l-5.4 3.6 1.9 6.4L12 16.4 7 20l1.9-6.4L3.5 10l6.3-1.7z"/></svg>
      <b>OpenCode</b>
    </div>
    <div class="pad">
      <button class="newchat" id="newchat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newChat">新对话</span>
      </button>
    </div>
    <div class="label" data-i18n="recents">最近</div>
    <div class="sessions" id="sessions">
      <div class="empty-hint" data-i18n="noSessions">这里会列出你与 OpenCode 的会话</div>
    </div>
    <div class="foot">
      <button id="openPlugins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span data-i18n="plugins">插件</span><span class="pill" id="pluginCount">0</span>
      </button>
      <button id="openAgents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
        <span data-i18n="agents">Agent</span><span class="pill" id="agentCount">0</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="menu" id="menu" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <button class="model" id="modelBtn">
        <span id="modelName">加载中…</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="iconbtn" id="connBtn" title="连接状态"><span class="dot off" id="connDot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button class="iconbtn" id="lang" title="语言">中</button>
      <button class="iconbtn" id="theme" title="主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>

    <div class="scroll" id="scroll">
      <div class="wrap hello" id="viewEmpty">
        <h1 class="serif"><em>✳</em> <span data-i18n="hero">今天想做点什么？</span></h1>
        <div class="suggests">
          <button class="tag" data-i18n="t1">解释这段代码</button>
          <button class="tag" data-i18n="t2">帮我写个脚本</button>
          <button class="tag" data-i18n="t3">总结这个文件</button>
          <button class="tag" data-i18n="t4">排查报错</button>
        </div>
      </div>
      <div class="wrap thread" id="viewThread" style="display:none"></div>
    </div>

    <div class="composer">
      <div class="box">
        <textarea rows="1" placeholder="怎么帮你？" data-i18n-ph="ph" id="ta"></textarea>
        <div class="tools">
          <button class="tool" aria-label="attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="tool" aria-label="tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M14.7 6.3a4 4 0 105.4 5.4L21 21H3l.9-9.3a4 4 0 005.4-5.4z"/></svg>
          </button>
          <button class="send" id="sendBtn" aria-label="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="hint" id="hint" data-i18n="hint">已连接 OpenCode</div>
    </div>
  </main>

  <div class="picker" id="picker"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
var DICT = {
  zh:{ newChat:"新对话", recents:"最近", plugins:"插件", agents:"Agent",
       noSessions:"这里会列出你与 OpenCode 的会话",
       hero:"今天想做点什么？", t1:"解释这段代码", t2:"帮我写个脚本", t3:"总结这个文件", t4:"排查报错",
       ph:"怎么帮你？", hint:"已连接 OpenCode", copy:"复制", copied:"已复制",
       model:"选择模型", thought:"思考中", thoughtN:"思考了 {n} 秒",
       running:"执行中", done:"完成", failed:"失败", free:"免费",
       reqFail:"请求失败", noModel:"没有可用模型" },
  en:{ newChat:"New chat", recents:"Recents", plugins:"Plugins", agents:"Agents",
       noSessions:"Your OpenCode sessions will show up here",

var KWS = ["const","let","var","function","return","if","else","for","while","await","async","new",
  "export","import","from","default","class","extends","interface","type","enum","public","private",
  "readonly","static","void","null","undefined","true","false","this","try","catch","finally","throw",
  "typeof","instanceof","in","of","delete","yield","super","as","def","None","True","False"];
var KW_RE = new RegExp("\\b(" + KWS.join("|") + ")\\b");
function highlight(raw){
  var src = esc(raw), out = "", last = 0, m;
  var re = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g;
  while ((m = re.exec(src)) !== null){
    out += plain(src.slice(last, m.index));
    out += m[1] ? '<span class="tk-cmt">'+m[1]+'</span>' : '<span class="tk-str">'+m[2]+'</span>';
    last = re.lastIndex;
  }
  out += plain(src.slice(last));
  return out;
  function plain(chunk){
    if (!chunk) return "";
    chunk = chunk.replace(KW_RE, '<span class="tk-kw">$1</span>');
    chunk = chunk.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tk-num">$1</span>');
    return chunk;
  }
}
function highlightAll(root){
  var pres = (root||document).querySelectorAll("pre[data-lang]");
  for (var i=0;i<pres.length;i++){
    var el = pres[i];
    if (el.dataset.hl === "1") continue;
    el.dataset.raw = el.textContent;
    el.innerHTML = highlight(el.textContent);
    el.dataset.hl = "1";
  }
}

function mdToHtml(src){
  var parts = String(src||"").split("```"), out = "";
  for (var i=0;i<parts.length;i++){
    if (i % 2 === 1){
      var seg = parts[i], nl = seg.indexOf("\n");
      var info = nl >= 0 ? seg.slice(0, nl).trim() : "";
      var code = nl >= 0 ? seg.slice(nl+1) : seg;
      out += codeCard(info.split(/\s+/)[0] || "text", code);
    } else {
      out += textToHtml(parts[i]);
    }
  }
  return out;
}
function codeCard(langName, code){
  return '<div class="card"><div class="card-head">'+
    '<span class="name">'+esc(langName)+'</span>'+
    '<div class="acts"><button class="act-copy">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'+
      '<span>'+esc(t("copy"))+'</span></button></div>'+
    '<button class="fld" aria-label="fold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '</div><div class="card-body"><pre data-lang="'+esc(langName)+'">'+esc(code)+'</pre></div></div>';
}
function textToHtml(txt){
  return String(txt||"").split(/\n{2,}/).map(function(p){
    var s = p.trim(); if (!s) return "";
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
    s = s.replace(/^[-*]\s+(.+)$/gm, "• $1");
    s = s.replace(/\n/g, "<br>");
    return '<p class="p">'+s+'</p>';
  }).join("");
}

var S = { models:[], plugins:[], agents:[], sessions:[], directory:"", messages:[], sessionID:null,
          sending:false, timer:null, model:null, pending:null, connected:false };
var SCROLL = document.getElementById("scroll");

/* ---------- 请求层：直连 OpenCode 无头服务 ---------- */
var CFG = Object.assign({ baseUrl: "", auth: "" }, window.OCW_CONFIG || {});
function authHeader(){ return CFG.auth ? { authorization: "Basic " + CFG.auth } : {}; }
async function call(path, opts){
  opts = opts || {};
  var headers = Object.assign({}, authHeader(), opts.headers || {});
  var r = await fetch(CFG.baseUrl + path, { method: opts.method || "GET", headers: headers, body: opts.body });
  if (!r.ok){
    var txt = "";
    try { txt = await r.text(); } catch(e){}
    throw new Error("HTTP " + r.status + (txt ? " · " + txt.slice(0, 160) : ""));
  }
  if (r.status === 204) return null;
  return r.json();
}
async function get(p){ return call(p); }
async function post(p, body){
  return call(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
}
function arr(v){ return Array.isArray(v) ? v : (v && Array.isArray(v.data) ? v.data : []); }

async function boot(){
  try {
    var locRes0 = await get("/api/location").catch(function(){ return null; });
    var loc0 = locRes0 && (locRes0.data || locRes0);
    var dir0 = (loc0 && loc0.directory) || "";
    var lq = dir0 ? "?location[directory]=" + encodeURIComponent(dir0) : "";
    var res = await Promise.all([
      get("/api/model" + lq), get("/api/plugin" + lq), get("/api/agent" + lq),
      get("/api/model/default" + lq), get("/api/session"), get("/api/location")
    ]);
    S.connected = true;
    S.models = arr(res[0]).map(function(m){
      return { id: m.id || m.modelID, name: m.name || m.id, providerID: m.providerID,
               cost: (m.cost && m.cost[0]) ? { input: m.cost[0].input, output: m.cost[0].output } : null,
               context: (m.limit && m.limit.context) || null, enabled: m.enabled !== false };
    });
    S.plugins = arr(res[1]).map(function(x){
      return { id: x.id, name: x.id, enabled: !(x.state && x.state.status && x.state.status !== "active"),
               source: (x.source && x.source.type) || "builtin" };
    });
    S.agents = arr(res[2]).map(function(a){
      return { id: a.id, name: a.name || a.id, description: a.description || "", mode: a.mode || null };
    });
    S.sessions = arr(res[4]).map(function(s){
      return { id: s.id, title: s.title || (lang === "zh" ? "未命名会话" : "Untitled"), updated: (s.time && s.time.updated) || 0 };
    }).sort(function(a,b){ return (b.updated || 0) - (a.updated || 0); });

    var d = res[3] && (res[3].data || res[3]);
    S.model = d ? { id: d.id || d.modelID, providerID: d.providerID, name: d.name || d.id } : (S.models[0] || null);
    var loc = res[5] && (res[5].data || res[5]);
    S.directory = (loc && loc.directory) || "";

    document.getElementById("pluginCount").textContent = S.plugins.length;
    document.getElementById("agentCount").textContent = S.agents.length;
    document.getElementById("hint").textContent = t("hint") + (S.directory ? " · " + S.directory : "");
    setConn(true);

    var sid = localStorage.getItem("ocw-session");
    if (sid && S.sessions.some(function(x){ return x.id === sid; })){
      S.sessionID = sid;
      await refresh();
    } else if (S.sessions.length){
      S.sessionID = S.sessions[0].id;
      localStorage.setItem("ocw-session", S.sessionID);
      await refresh();
    } else { renderAll(); }
  } catch (e) {
    setConn(false);
    document.getElementById("hint").textContent = t("reqFail") + "：" + e.message;
    document.getElementById("modelName").textContent = "OpenCode 未连接";
  }
}
function setConn(ok){ var dot = document.getElementById("connDot"); if (dot) dot.className = ok ? "dot" : "dot off"; }
function modelLabel(m){
  if (!m) return "—";
  var id = m.id || m.modelID;
  var found = S.models.filter(function(x){ return x.id === id && x.providerID === m.providerID; })[0];
  return found ? found.name : (id || "—");
}

function renderAll(){ renderModelName(); renderSessions(); renderThread(); }
function renderModelName(){ document.getElementById("modelName").textContent = S.model ? (S.model.name || S.model.id) : "—"; }
function renderSessions(){
  var el = document.getElementById("sessions");
  var list = S.sessions || [];
  if (!list.length){ el.innerHTML = '<div class="empty-hint">'+esc(t("noSessions"))+'</div>'; return; }
  el.innerHTML = list.slice(0, 20).map(function(s){
    return '<button class="session'+(s.id === S.sessionID ? " on" : "")+'" data-sid="'+esc(s.id)+'">'+esc(s.title)+'</button>';
  }).join("");
  var btns = el.querySelectorAll(".session");
  for (var i=0;i<btns.length;i++){
    btns[i].onclick = function(){
      var id = this.getAttribute("data-sid");
      closeDrawer();
      if (id === S.sessionID) return;
      S.sessionID = id;
      localStorage.setItem("ocw-session", id);
      S.messages = []; S.pending = null; S.sending = false;
      stopPoll();
      refresh();
    };
  }
}
function renderThread(){
  var empty = document.getElementById("viewEmpty"), thread = document.getElementById("viewThread");
  var hasContent = S.messages.length > 0 || S.pending;
  if (!hasContent){ empty.style.display = "flex"; thread.style.display = "none"; return; }
  empty.style.display = "none"; thread.style.display = "block";

  var html = "";
  for (var i=0;i<S.messages.length;i++) html += renderMsg(S.messages[i], S.messages[i+1]);
  if (S.pending) html += '<div class="turn user"><div class="body">'+esc(S.pending)+'</div></div>';
  thread.innerHTML = html;
  highlightAll(thread);
  bindToggles(thread);
  bindCards(thread);
  SCROLL.scrollTop = SCROLL.scrollHeight;
}
function renderMsg(m, next){
  if (!m || !m.type) return "";
  if (m.type === "user") return '<div class="turn user"><div class="body">'+esc(m.text||"")+'</div></div>';
  if (m.type === "assistant") return renderAssistant(m, !next || next.type !== "assistant");
  return "";
}
function renderAssistant(m, showMeta){
  var blocks = Array.isArray(m.content) ? m.content : [];
  var body = blocks.map(renderBlock).join("");
  if (!body) body = '<p class="p" style="color:var(--text3)">…</p>';
  var meta = [];
  if (m.model) meta.push(modelLabel(m.model));
  if (m.tokens) meta.push("↑"+(m.tokens.input||0)+"  ↓"+(m.tokens.output||0));
  if (m.time && m.time.created && m.time.completed) meta.push(((m.time.completed-m.time.created)/1000).toFixed(1)+"s");
  if (m.cost) meta.push("$"+Number(m.cost).toFixed(4));
  return '<div class="turn bot"><div class="avatar">✳</div><div class="body">'+body+
    (showMeta && meta.length ? '<div class="msgmeta">'+esc(meta.join("  ·  "))+'</div>' : '')+'</div></div>';
}
function renderBlock(b){
  if (!b) return "";
  if (b.type === "reasoning"){
    var secs = (b.time && b.time.created && b.time.completed) ? ((b.time.completed-b.time.created)/1000).toFixed(1) : null;
    return '<div class="think" data-toggle>'+star()+
      '<span class="lbl">'+esc(secs ? t("thoughtN", secs) : t("thought"))+'</span>'+chev()+'</div>'+
      '<div class="coll thinking"><div class="dhead">reasoning'+(secs?' · '+secs+'s':'')+'</div><pre>'+esc(b.text||"")+'</pre></div>';
  }
  if (b.type === "text") return mdToHtml(b.text||"");
  if (b.type === "tool") return renderTool(b);
  return "";
}
function renderTool(b){
  var st = b.state || {};
  var status = st.status || "completed";
  var cls = status === "error" ? " err" : (status === "running" || status === "streaming") ? " running" : "";
  var statusLabel = status === "error" ? t("failed") : (status === "completed" ? t("done") : t("running"));
  var inputTxt = "";
  try { inputTxt = JSON.stringify(st.input || {}, null, 2); } catch(e){ inputTxt = String(st.input||""); }
  var outTxt = Array.isArray(st.content) ? st.content.map(function(c){ return c.text || ""; }).join("\n") : "";
  var detail = (inputTxt && inputTxt !== "{}" ? inputTxt : "") + (outTxt ? "\n\n" + outTxt : "");
  return '<div class="steps"><button class="step'+cls+'" data-toggle>'+toolIcon(b.name)+
    '<span class="nm">'+esc(toolTitle(b.name))+'</span>'+
    '<span class="meta">'+esc(statusLabel)+'</span>'+chev()+'</button>'+
    '<div class="coll"><div class="dhead">'+esc(b.name||"tool")+'</div><pre data-lang="text">'+esc(detail || "—")+'</pre></div></div>';
}

function bindToggles(root){
  var ts = root.querySelectorAll("[data-toggle]");
  for (var i=0;i<ts.length;i++){
    ts[i].onclick = function(){
      var open = this.classList.toggle("open");
      var next = this.nextElementSibling;
      if (next && next.classList.contains("coll")) next.classList.toggle("show", open);
    };
  }
}
function bindCards(root){
  var heads = root.querySelectorAll(".card-head");
  for (var i=0;i<heads.length;i++){
    heads[i].onclick = function(e){
      if (e.target.closest && e.target.closest("button.act-copy")) return;
      this.parentNode.classList.toggle("collapsed");
    };
  }
  var copies = root.querySelectorAll(".act-copy");
  for (var j=0;j<copies.length;j++){
    copies[j].onclick = function(e){
      e.stopPropagation();
      var pre = this.closest(".card").querySelector("pre[data-lang]");
      if (!pre) return;
      var txt = pre.dataset.raw || pre.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
      var self = this, span = this.querySelector("span");
      if (span){ span.textContent = t("copied"); setTimeout(function(){ var s2 = self.querySelector("span"); if (s2) s2.textContent = t("copy"); }, 1400); }
    };
  }
}

async function newSession(){
  try {
    var s = await post("/api/session", {});
    var sm = s && (s.data || s);
    if (sm && sm.id){
      S.sessionID = sm.id;
      localStorage.setItem("ocw-session", sm.id);
      S.sessions.unshift({ id: sm.id, title: (lang==="zh" ? "新对话" : "New chat"), updated: Date.now() });
      S.messages = []; S.pending = null; S.sending = false;
      stopPoll();
      renderAll(); closeDrawer();
    }
  } catch(e){}
}
async function refresh(){
  if (!S.sessionID){ renderAll(); return; }
  try {
    var r = await get("/api/session/" + encodeURIComponent(S.sessionID) + "/message");
    var msgs = arr(r);
    S.messages = msgs;
    var last = msgs[msgs.length-1];
    if (last && last.type === "idle"){ S.sending = false; S.pending = null; stopPoll(); document.getElementById("sendBtn").classList.remove("busy"); }
    renderAll();
  } catch(e){}
}
function startPoll(){ stopPoll(); S.timer = setInterval(refresh, 1500); }
function stopPoll(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } }

async function send(){
  var ta = document.getElementById("ta");
  var text = (ta.value || "").trim();
  if (!text || S.sending) return;
  ta.value = ""; ta.style.height = "auto";

  if (!S.sessionID){
    try {
      var s = await post("/api/session", {});
      var sm = s && (s.data || s);
      if (!sm || !sm.id){ document.getElementById("hint").textContent = t("reqFail"); return; }
      S.sessionID = sm.id;
      localStorage.setItem("ocw-session", sm.id);
      S.sessions.unshift({ id: sm.id, title: text.slice(0, 40), updated: Date.now() });
    } catch(e){ document.getElementById("hint").textContent = t("reqFail") + "：" + e.message; return; }
  }
  S.sending = true; S.pending = text;
  document.getElementById("sendBtn").classList.add("busy");
  renderThread();
  try {
    await post("/api/session/" + encodeURIComponent(S.sessionID) + "/prompt", { text: text });
  } catch(e){
    S.sending = false; S.pending = null;
    document.getElementById("sendBtn").classList.remove("busy");
    document.getElementById("hint").textContent = t("reqFail") + "：" + e.message;
    renderThread(); return;
  }
  startPoll();
  setTimeout(refresh, 600);
}

}

document.getElementById("sendBtn").onclick = send;
document.getElementById("modelBtn").onclick = function(e){
  e.stopPropagation();
  var pk = document.getElementById("picker");
  var sh = document.getElementById("sheet");
  sh.classList.remove("show");
  if (pk.classList.contains("show")) pk.classList.remove("show"); else openPicker();
};
document.getElementById("openPlugins").onclick = function(e){
  e.stopPropagation();
  document.getElementById("picker").classList.remove("show");
  openSheet("plugins");
};
document.getElementById("openAgents").onclick = function(e){
  e.stopPropagation();
  document.getElementById("picker").classList.remove("show");
  openSheet("agents");
};
document.getElementById("newchat").onclick = newSession;
document.addEventListener("click", function(e){
  var el = e.target;
  if (el.closest && (el.closest("#picker") || el.closest("#modelBtn"))) {} else document.getElementById("picker").classList.remove("show");
  if (el.closest && (el.closest("#sheet") || el.closest("#openPlugins") || el.closest("#openAgents"))) {} else document.getElementById("sheet").classList.remove("show");
});
var sidebar = document.getElementById("sidebar"), scrim = document.getElementById("scrim");
function closeDrawer(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("menu").onclick = function(){ sidebar.classList.add("open"); scrim.classList.add("show"); };
scrim.onclick = closeDrawer;
window.addEventListener("keydown", function(e){ if (e.key === "Escape") closeDrawer(); });
window.addEventListener("resize", function(){ if (window.innerWidth > 900) closeDrawer(); });

var ta = document.getElementById("ta");
ta.addEventListener("input", function(){ ta.style.height="auto"; ta.style.height = Math.min(ta.scrollHeight,160)+"px"; });
ta.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
var tags = document.querySelectorAll(".tag");
for (var i=0;i<tags.length;i++){
  tags[i].onclick = function(){ ta.value = this.textContent; ta.focus(); ta.style.height="auto"; ta.style.height = Math.min(ta.scrollHeight,160)+"px"; };
}

applyTheme(); applyLang(); boot();
</script>
</body>
</html>
